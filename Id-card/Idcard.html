<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Idcard.css" />
    <title>ID Card</title>
  </head>
  <body>
    <div class="margin-top"></div>
    <div class="Id-Card">
      <div>
        <h1 class="head-text">Student Card</h1>
      </div>
      <div class="imgs">
        <img class="img" src="./img/Virak-profile.png" alt="" />
      </div>
      <div class="position">
        <span class="full-name">Vactor</span><br />
        <span class="school-name">Western Internation school</span>
      </div>
      <div class="personal-information">
        <table class="information-table">
          <tr>
            <th>ID:</th>
            <td>WIS-001</td>
          </tr>
          <tr>
            <th>SEX:</th>

            <td>Male</td>
          </tr>
          <tr>
            <th>TELEGRAM:</th>
            <td>092 XXX XXX</td>
          </tr>
          <tr>
            <th>ENROLLED:</th>
            <td>10-Oct-2010</td>
          </tr>
        </table>
      </div>
      <div class="QR">
        <img style="height: 70px; width: 70px" src="./img/QRimg.png" alt="QR" />
      </div>
      <!-- button Orange -->
      <div class="buttom-text">
        <div class="text-detial">
          <span class="span-text-button">Western Insternation School.org</span
          ><br />
          <span class="span-text-button-num">+855 9XX XXX</span>
        </div>
      </div>
    </div>
  </body>
</html>
